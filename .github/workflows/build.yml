name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    # Electrobun builds each OS on that OS, so every target needs its own runner.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Hutch (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Install Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          "$HOME\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # shortcut: not `hutch run install` (--frozen-lockfile), it always fails on Hutch 0.27.1; switch back once fixed.
      - name: Install dependencies
        run: hutch install

      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Linux'

      - name: Test
        if: runner.os == 'Linux'
        run: bun test

      - name: Build
        shell: bash
        env:
          # macOS signing/notarization only runs when these secrets are set (see electrobun.config.ts).
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            hutch run build
          else
            hutch run build:canary
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: debrid-downloader-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
